# Build safety: fail on warnings (including duplicate URLs, which silently overwrite posts)
printPathWarnings = true
panicOnWarning = true

baseURL = "https://YOUR-USERNAME.github.io/"
locale = "en-us"
title = "Field Notes"
theme = "PaperMod"

enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  env = "production"
  # Visual style: "chirpy" (sidebar + cards), "notebook" (serif, editorial) or "minimal" (sans, modern)
  style = "chirpy"
  mainSections = ["posts"]
  DateFormat = "2 January 2006"
  avatar = "/avatar.png"
  description = "Essays, a working journal, and the occasional technical write-up"
  author = "Your Name"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = "Notes from a working engineer"
    Content = "Essays, a running journal, and the occasional technical deep-dive. Written by Your Name."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/YOUR-USERNAME"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.highlight]
  noClasses = false
  lineNos = false

[[menus.main]]
  name = "Archive"
  url = "/archives/"
  weight = 20
[[menus.main]]
  name = "Search"
  url = "/search/"
  weight = 30
[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 50

[taxonomies]
  category = "categories"
  tag = "tags"

# Post URLs use the slug or filename, never the folder, so folders can be reorganised freely
[permalinks.page]
  posts = "/posts/:slugorfilename/"
